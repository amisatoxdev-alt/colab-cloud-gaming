<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>XGS Streaming • Xyris Cloud Gaming</title>
  <link rel="stylesheet" href="/static/css/portal.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* Small subtle gear icon in the top right */
    .btn-settings-gear {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: all 0.15s ease-in-out;
      opacity: 0.6;
    }

    .btn-settings-gear:hover, .btn-settings-gear:active {
      opacity: 1;
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="player-container" id="playerContainer">
    <!-- Live Video Canvas -->
    <canvas id="streamCanvas" width="1368" height="768"></canvas>

    <!-- Client-Side Cursor Dot Indicator for Touch/Mobile -->
    <div class="client-cursor-dot" id="clientCursorDot"></div>

    <!-- Small Subtle Settings Icon (Single button, no long menu!) -->
    <button class="btn-settings-gear" id="btnSettingsGear" title="Settings">⚙️</button>

    <!-- Minimal Stats HUD (Toggleable) -->
    <div class="hud-overlay" id="hudOverlay" style="display: none;">
      <div class="hud-item">FPS: <span id="hudFps">--</span></div>
      <div class="hud-item">Ping: <span id="hudPing">-- ms</span></div>
      <div class="hud-item">Bitrate: <span id="hudBitrate">-- Mbps</span></div>
      <div class="hud-item">Sound: <span id="hudAudio">Active (48kHz)</span></div>
      <div class="hud-item">Mouse: <span id="hudInput">Client Cursor</span></div>
    </div>

    <!-- Hidden native keyboard trigger input for mobile phones -->
    <input type="text" id="mobileKeyboardInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="position: fixed; opacity: 0; pointer-events: none; left: -9999px; top: -9999px;">

    <!-- Mobile Quick Text Input Drawer -->
    <div class="mobile-text-drawer" id="mobileTextDrawer">
      <input type="text" id="mobileTextInput" placeholder="Type text to send to Cloud PC..." autocomplete="off">
      <button class="text-send-btn" id="btnSendText">SEND</button>
      <button class="text-key-btn" id="btnKeyEnter">ENTER ↵</button>
      <button class="text-key-btn" id="btnKeyEsc">ESC</button>
      <button class="text-key-btn" id="btnKeyTab">TAB</button>
      <button class="text-close-btn" id="btnCloseTextDrawer">✕</button>
    </div>

    <!-- On-Screen Virtual Mouse & Trackpad Overlay (Toggleable from settings) -->
    <div class="virtual-mouse-overlay" id="virtualMouseOverlay">
      <div class="vm-header">
        <span class="vm-title">🖱️ ON-SCREEN MOUSE</span>
        <button class="vm-mode-btn" id="btnToggleMouseMode">MODE: TRACKPAD</button>
        <button class="vm-close-btn" id="btnCloseVirtualMouse">✕</button>
      </div>

      <!-- Touch Surface for thumb dragging -->
      <div class="vm-touchpad" id="vmTouchpad">
        <span>DRAG FINGER TO MOVE CURSOR</span>
      </div>

      <!-- On-Screen Hardware Mouse Click Buttons -->
      <div class="vm-buttons">
        <button class="vm-btn lmb" id="btnLMB">LEFT CLICK</button>
        <div class="vm-scroll-col">
          <button class="vm-btn sm" id="btnScrollUp">▲ UP</button>
          <button class="vm-btn sm" id="btnScrollDown">▼ DOWN</button>
        </div>
        <button class="vm-btn rmb" id="btnRMB">RIGHT CLICK</button>
      </div>
    </div>

    <!-- In-Game Settings Modal (Opens when clicking ⚙️ gear icon) -->
    <div class="settings-modal" id="inGameSettingsModal">
      <div class="settings-box">
        <div class="settings-header">
          <span class="settings-title">⚙️ STREAM & CONTROLS</span>
          <button class="settings-close-btn" id="btnCloseInGameSettings">✕</button>
        </div>

        <!-- Quick Action Buttons Grid (Compact & Responsive) -->
        <div class="settings-actions-grid">
          <button class="btn-subtle" id="btnRelock">🔒 LOCK (FPS)</button>
          <button class="btn-subtle" id="btnFullscreen">⛶ FULLSCREEN</button>
          <button class="btn-subtle" id="btnMobileKeyboard">⌨️ KEYBOARD</button>
          <button class="btn-subtle" id="btnVirtualMouse">🖱️ VIRTUAL PAD</button>
          <button class="btn-subtle" id="btnToggleHud">📊 STATS HUD</button>
          <button class="btn-subtle" id="btnToggleSound">🔊 AUDIO (ON)</button>
        </div>

        <div class="settings-group">
          <label class="settings-label">
            LIVE BITRATE TARGET
            <span id="liveBitrateVal">4 Mbps (Ultra-Low Latency)</span>
          </label>
          <input type="range" class="settings-range" id="liveBitrateSlider" min="1" max="25" step="1" value="4">
        </div>

        <div class="settings-group">
          <label class="settings-label">
            MOUSE CONTROL METHOD
            <span>INPUT</span>
          </label>
          <select class="settings-select" id="liveMouseSelect">
            <option value="client" selected>🖱️ Client-Side Mouse (Visible Cursor • Recommended)</option>
            <option value="locked">🔒 3D Gaming Lock (FPS Camera / PointerLock)</option>
            <option value="trackpad">📱 Mobile Touch Trackpad</option>
          </select>
        </div>

        <div class="settings-group">
          <label class="settings-label">
            VIDEO CODEC & DECODER
            <span id="liveCodecVal">H.264 ULL</span>
          </label>
          <select class="settings-select" id="liveCodecSelect">
            <option value="h264" selected>H.264 (Hardware NVENC • Sub-1ms Decode)</option>
            <option value="av1">AV1 (Hardware NVENC • Next-Gen)</option>
          </select>
        </div>

        <div class="settings-group">
          <label class="settings-label">
            QUEUE LATENCY MODE
            <span>ANTI-LAG</span>
          </label>
          <select class="settings-select" id="liveQueueSelect">
            <option value="zero" selected>Zero-Queue Anti-Lag (Drop Late Frames • ~100ms Ping)</option>
            <option value="smooth">1-Frame Smooth Buffer</option>
          </select>
        </div>

        <div class="settings-actions" style="justify-content: space-between;">
          <button class="btn-subtle exit" id="btnExit" style="border-color: #ff3333; color: #ff5555; padding: 0.5rem 1rem;">✕ EXIT</button>
          <button class="btn-primary" id="btnApplyInGameSettings" style="padding: 0.5rem 1.25rem;">RESUME</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/stream_client.js"></script>
</body>
</html>
